[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "packetflowai"
version = "3.0.0"
description = "Predictive cyber defence with a temporal world model and deterministic HDC"
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
dependencies = [
  "torch>=2.2",
  "numpy>=1.26",
  "scapy>=2.5",
  "datasets>=2.18",
  "scikit-learn>=1.4",
]

[project.optional-dependencies]
dev = [
  "mypy==1.13.0",
  "pip-audit>=2.7",
  "ruff==0.15.22",
]
presentation = [
  "playwright==1.62.0",
]

[project.scripts]
packetflowai = "packetflowai.cli:main"

[tool.setuptools.packages.find]
include = ["packetflowai*"]

[tool.setuptools.package-data]
packetflowai = ["static/*.html", "static/*.css", "static/*.js"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.11"
warn_unused_configs = true
check_untyped_defs = true
no_implicit_optional = true
ignore_missing_imports = true
